name: Feature request
description: Propose a focused product or integration improvement
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What self-hosting or integration problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: operations
    attributes:
      label: Operational impact
      description: Consider compatibility, persistence, security, and single-instance constraints.
